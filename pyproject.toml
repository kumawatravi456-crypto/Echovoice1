[project]
name = "project-echo-visual-ai-pipeline"
version = "0.1.0"
description = "Project Echo Backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "python-multipart>=0.0.9",
    "uvicorn>=0.30.0",
    "pydantic>=2.0.0",
    "numpy>=2.0.0",
    "scikit-learn>=1.5.0",
    "joblib>=1.4.0",
    "groq>=1.0.0",
    "httpx>=0.27.0",
    "mediapipe>=0.10.14",
    "opencv-python-headless>=4.10.0.84",
    "httpx2>=2.16.0",
]

[tool.vercel]
entrypoint = "backend.app.main:app"
